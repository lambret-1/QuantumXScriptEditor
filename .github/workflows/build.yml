name: 构建未签名IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# 同一分支只保留最新一次构建，取消旧的运行，避免多次推送触发重复构建
concurrency:
  group: 构建-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装XcodeGen
        run: brew install xcodegen

      - name: 生成Xcode项目
        run: xcodegen generate

      - name: 降级项目格式以兼容Xcode15
        run: |
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' "圈X脚本编辑器.xcodeproj/project.pbxproj"
          plutil -convert xml1 "圈X脚本编辑器.xcodeproj/project.pbxproj"

      - name: 构建未签名IPA
        run: |
          xcodebuild -project "圈X脚本编辑器.xcodeproj" \
            -scheme "QuantumXScriptEditor" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包IPA（文件名含版本号）
        run: |
          # 从Info.plist读取版本号
          VERSION=$(plutil -extract CFBundleShortVersionString raw -o - Info.plist | tr -d '\n')
          IPA_NAME="QuantumXScriptEditor-v${VERSION}.ipa"
          echo "IPA文件名: $IPA_NAME"
          # 将版本号写入环境变量供后续步骤使用
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          APP_PATH="build/Build/Products/Release-iphoneos/QuantumXScriptEditor.app"

          # 【关键修复】未签名编译时Xcode不会自动embed共享扩展，需手动复制到.app/PlugIns目录
          # 否则IPA安装时校验失败，提示"无法安装"
          PLUGINS_DIR="$APP_PATH/PlugIns"
          mkdir -p "$PLUGINS_DIR"
          # 查找共享扩展的.appex文件
          SHARE_EXT_PATH=$(find build/Build/Products/Release-iphoneos -name "ShareExtension.appex" -type d | head -1)
          if [ -n "$SHARE_EXT_PATH" ]; then
            echo "找到共享扩展: $SHARE_EXT_PATH"
            cp -R "$SHARE_EXT_PATH" "$PLUGINS_DIR/"
            echo "已复制共享扩展到 $PLUGINS_DIR"
            # 验证复制结果
            ls -la "$PLUGINS_DIR/"
          else
            echo "警告：未找到ShareExtension.appex，共享扩展可能未被正确构建"
          fi

          # 验证主二进制架构（确保包含arm64）
          echo "检查主二进制架构:"
          lipo -info "$APP_PATH/QuantumXScriptEditor" || echo "警告：lipo检查失败"

          # 验证扩展二进制架构
          if [ -d "$PLUGINS_DIR/ShareExtension.appex" ]; then
            echo "检查扩展二进制架构:"
            lipo -info "$PLUGINS_DIR/ShareExtension.appex/ShareExtension" || echo "警告：扩展二进制lipo检查失败"
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r "$IPA_NAME" Payload
          rm -rf Payload

      - name: 上传IPA产物
        uses: actions/upload-artifact@v4
        with:
          name: QuantumXScriptEditor-v${{ env.VERSION }}
          path: ${{ env.IPA_NAME }}

      - name: 自动发布Release
        run: |
          TAG="v${VERSION}"
          echo "发布标签: $TAG"
          echo "IPA文件: $IPA_NAME"

          # 检查Release是否已存在，存在则先删除旧版本
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，删除旧版本后重新发布"
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes
          fi

          # 写入发布说明到临时文件
          cat > release_notes.md << NOTESEOF
          ## 自动构建发布

          - 版本：$TAG
          - 构建环境：Xcode 15.4 / macOS 14
          - 最低支持：iOS 14.0
          - 产物：未签名IPA（需自签名或侧载安装）
          - 文件名：$IPA_NAME

          > 本Release由GitHub Actions自动构建发布，每次推送master分支自动更新。
          NOTESEOF

          # 创建新Release并上传IPA
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG 圈X脚本编辑器" \
            --notes-file release_notes.md \
            "$IPA_NAME"

          echo "Release发布成功: $TAG"
          echo "下载地址: https://github.com/${{ github.repository }}/releases/download/$TAG/$IPA_NAME"
