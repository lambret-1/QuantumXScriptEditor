name: 构建未签名IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装XcodeGen
        run: brew install xcodegen

      - name: 生成Xcode项目
        run: xcodegen generate

      - name: 降级项目格式以兼容Xcode15
        run: |
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' "圈X脚本编辑器.xcodeproj/project.pbxproj"
          plutil -convert xml1 "圈X脚本编辑器.xcodeproj/project.pbxproj"

      - name: 构建未签名IPA
        run: |
          xcodebuild -project "圈X脚本编辑器.xcodeproj" \
            -scheme "圈X脚本编辑器" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/圈X脚本编辑器.app" Payload/
          zip -r "QuantumXScriptEditor-unsigned.ipa" Payload
          rm -rf Payload

      - name: 上传IPA产物
        uses: actions/upload-artifact@v4
        with:
          name: QuantumXScriptEditor-unsigned
          path: QuantumXScriptEditor-unsigned.ipa

      - name: 自动发布Release
        run: |
          # 从Info.plist读取版本号
          VERSION=$(plutil -extract CFBundleShortVersionString raw -o - Info.plist | tr -d '\n')
          echo "当前版本号: $VERSION"
          TAG="v$VERSION"
          IPA_NAME="QuantumXScriptEditor-unsigned.ipa"

          # 检查Release是否已存在，存在则先删除旧版本
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，删除旧版本后重新发布"
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes
          fi

          # 创建新Release并上传IPA
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG 圈X脚本编辑器" \
            --notes "## 自动构建发布

- 版本：$TAG
- 构建环境：Xcode 15.4 / macOS 14
- 最低支持：iOS 14.0
- 产物：未签名IPA（需自签名或侧载安装）

> 本Release由GitHub Actions自动构建发布，每次推送master分支自动更新。" \
            "$IPA_NAME"

          echo "Release发布成功: $TAG"
          echo "下载地址: https://github.com/${{ github.repository }}/releases/download/$TAG/$IPA_NAME"
