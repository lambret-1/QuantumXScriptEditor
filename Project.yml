name: 圈X脚本编辑器
options:
  bundleIdPrefix: com.quantumx.editor
  deploymentTarget:
    iOS: "14.0"
  xcodeVersion: "15.4"
  projectFormat: Xcode 14.0
  createIntermediateGroups: true
targets:
  QuantumXScriptEditor:
    type: application
    platform: iOS
    bundleId: com.quantumx.editor
    sources:
      - path: Sources
        excludes:
          - 共享扩展
      - Assets
    settings:
      base:
        PRODUCT_NAME: QuantumXScriptEditor
        PRODUCT_BUNDLE_IDENTIFIER: com.quantumx.editor
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 圈X脚本编辑器
        CFBundleShortVersionString: "1.7.3"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.quantumx.editor.import
            CFBundleURLSchemes:
              - quantumx
        CFBundleDocumentTypes:
          - CFBundleTypeName: JavaScript源码文件
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.netscape.javascript-source
              - public.source-code
              - public.plain-text
              - public.data
            CFBundleTypeExtensions:
              - js
              - mjs
              - cjs
              - txt
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.netscape.javascript-source
            UTTypeDescription: JavaScript源码
            UTTypeConformsTo:
              - public.source-code
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - js
                - mjs
                - cjs
              public.mime-type:
                - application/javascript
                - text/javascript
    dependencies:
      - target: ShareExtension
        embed: true
  ShareExtension:
    type: app-extension
    platform: iOS
    bundleId: com.quantumx.editor.ShareExtension
    sources:
      - Sources/共享扩展
    settings:
      base:
        PRODUCT_NAME: ShareExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.quantumx.editor.ShareExtension
        SKIP_INSTALL: YES
    info:
      path: Sources/共享扩展/Info.plist
      properties:
        CFBundleDisplayName: 导入到圈X脚本编辑器
        CFBundleShortVersionString: "1.7.3"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareExtension.ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: TRUEPREDICATE
