name: 圈X脚本编辑器
options:
  bundleIdPrefix: com.quantumx.editor
  deploymentTarget:
    iOS: "14.0"
  xcodeVersion: "15.4"
  projectFormat: Xcode 14.0
  createIntermediateGroups: true
targets:
  圈X脚本编辑器:
    type: application
    platform: iOS
    bundleId: com.quantumx.editor
    sources:
      - path: Sources
        excludes:
          - 共享扩展
      - Assets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 圈X脚本编辑器
        CFBundleShortVersionString: "1.6.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: ShareExtension
        embed: true
  ShareExtension:
    type: app-extension
    platform: iOS
    bundleId: com.quantumx.editor.ShareExtension
    sources:
      - Sources/共享扩展
    settings:
      base:
        PRODUCT_NAME: ShareExtension
        SKIP_INSTALL: YES
    info:
      path: Sources/共享扩展/Info.plist
      properties:
        CFBundleDisplayName: 导入到圈X脚本编辑器
        CFBundleShortVersionString: "1.6.1"
        CFBundleVersion: "1"
